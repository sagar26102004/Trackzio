services:
  postgres:
    image: postgres:17-alpine
    container_name: trackzio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackzio
      POSTGRES_PASSWORD: trackzio
      POSTGRES_DB: trackzio
    ports:
      - "5433:5432"
    volumes:
      - trackzio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackzio -d trackzio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackzio-pgdata:
