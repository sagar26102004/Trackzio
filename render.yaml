# Render blueprint for the Trackzio API.
#
# Import this from the Render dashboard (New -> Blueprint) and it provisions the
# service with the right build, start and health-check wiring. Secrets are marked
# sync:false so they are never committed - Render prompts for them on first deploy.
services:
  - type: web
    name: trackzio-api
    runtime: node
    plan: free
    # The Supabase project is in ap-northeast-1 (Tokyo) and Render has no Tokyo
    # region, so Singapore is the closest available (~70ms, against ~230ms from
    # Frankfurt). Every L2 cache read is a round trip to Postgres, so that gap is
    # paid on each cache miss.
    region: singapore
    rootDir: .
    # Migrations run at BUILD time, not start: a failed migration should fail the
    # deploy and leave the previous version serving, rather than crash-looping a
    # new one against a schema it cannot use.
    # --include=dev is required, not optional. NODE_ENV=production is set below for
    # the runtime, and npm reads it during install too: it flips `omit=dev`, so a
    # plain `npm ci` skips typescript, @types/node and the Prisma CLI - all of which
    # are build-time tools. Without this the build fails with a wall of "Cannot find
    # name 'setTimeout' / 'fetch' / 'URL'" errors, because the Node type definitions
    # were never installed.
    buildCommand: npm ci --include=dev && npm run build -w server && npm run db:deploy -w server
    # NODE_ENV is set HERE rather than as a service env var, and that placement is
    # the fix for a real trap: Render applies env vars to the build as well as the
    # runtime, and npm reads NODE_ENV at install time to decide whether to drop dev
    # dependencies. Declaring it as an env var therefore silently strips typescript,
    # @types/node and the Prisma CLI from the build. Setting it on the start command
    # gives the runtime what it needs while leaving the build a complete toolchain.
    startCommand: NODE_ENV=production npm run start -w server
    # Render restarts the service if this stops returning 2xx. It reports degraded
    # rather than failing when TMDB is down, so a third-party outage cannot trigger
    # a restart loop on our side.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Two hops in front of the app: Vercel's rewrite, then Render's own proxy.
      # This decides what req.ip resolves to, which the login rate limiter counts.
      - key: TRUST_PROXY
        value: "2"
      # The SPA reaches /api on its own origin via the Vercel rewrite, so the
      # cookies are first-party and Lax is correct. 'none' would be dropped
      # outright by Safari and Brave.
      - key: COOKIE_SAMESITE
        value: lax
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        # Render generates a strong value and keeps it stable across deploys.
        # Changing it invalidates every signed cookie, so it must not be rotated
        # casually - doing so signs everyone out.
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
